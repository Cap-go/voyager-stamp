      <!-- bottom edge -->
      <circle cx="16"  cy="240" r="11" fill="black"/>
      <circle cx="48"  cy="240" r="11" fill="black"/>
      <circle cx="80"  cy="240" r="11" fill="black"/>
      <circle cx="112" cy="240" r="11" fill="black"/>
